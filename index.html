<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎱 Control de Billar</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f2f4f7;
    color:#222;
    padding:15px;
}

h1{
    text-align:center;
    margin:10px 0 5px;
}

.subtitulo{
    text-align:center;
    color:#666;
    margin-bottom:20px;
}

.total{
    background:#168a3d;
    color:white;
    border-radius:15px;
    padding:20px;
    text-align:center;
    margin-bottom:15px;
}

.total h2{
    font-size:18px;
}

.total-monto{
    font-size:35px;
    font-weight:bold;
    margin-top:5px;
}

.contadores{
    background:white;
    padding:15px;
    border-radius:12px;
    text-align:center;
    margin-bottom:20px;
    font-size:18px;
}

.mesas{
    display:grid;
    grid-template-columns:1fr;
    gap:15px;
}

.mesa{
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 3px 10px #0002;
    border-top:7px solid #168a3d;
}

.mesa.ocupada{
    border-top-color:#e53935;
}

.titulo-mesa{
    font-size:26px;
    font-weight:bold;
    text-align:center;
}

.estado{
    text-align:center;
    margin:10px 0;
    font-weight:bold;
}

.libre{
    color:#168a3d;
}

.ocupada{
    color:#e53935;
}

.inicio{
    text-align:center;
    font-size:18px;
    margin:10px 0;
}

.cronometro{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    margin:15px 0;
    color:#1976d2;
}

button{
    width:100%;
    border:0;
    border-radius:10px;
    padding:16px;
    margin-top:8px;
    font-size:18px;
    font-weight:bold;
    color:white;
}

.iniciar{
    background:#168a3d;
}

.manual{
    background:#f39c12;
}

.finalizar{
    background:#e53935;
}

.historial{
    margin-top:30px;
}

.historial h2{
    margin-bottom:15px;
}

.partida{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:10px;
    box-shadow:0 2px 6px #0001;
}

.partida strong{
    font-size:19px;
}

.monto{
    color:#168a3d;
    font-size:22px;
    font-weight:bold;
    float:right;
}

.borrar{
    background:#555;
    margin-top:20px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#0009;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:10;
}

.modal.activo{
    display:flex;
}

.modal-contenido{
    background:white;
    border-radius:15px;
    padding:25px;
    width:100%;
    max-width:400px;
    text-align:center;
}

.modal-contenido h2{
    margin-bottom:15px;
}

.modal-contenido p{
    font-size:18px;
    margin:10px 0;
}

input{
    width:100%;
    padding:15px;
    font-size:24px;
    text-align:center;
    margin:15px 0;
    border:2px solid #ccc;
    border-radius:10px;
}

.confirmar{
    background:#1976d2;
}

.cancelar{
    background:#777;
}

.precio{
    font-size:38px;
    font-weight:bold;
    color:#168a3d;
    margin:15px;
}

@media(min-width:600px){
    .mesas{
        grid-template-columns:1fr 1fr;
    }
}
</style>
</head>

<body>

<h1>🎱 CONTROL DE BILLAR</h1>
<div class="subtitulo">Control de 4 mesas</div>

<div class="total">
    <h2>💰 TOTAL DEL DÍA</h2>
    <div class="total-monto" id="total">S/ 0.00</div>
</div>

<div class="contadores">
    🔴 Ocupadas: <span id="ocupadas">0</span>
    &nbsp;&nbsp;|&nbsp;&nbsp;
    🟢 Libres: <span id="libres">4</span>
</div>

<div class="mesas" id="mesas"></div>

<div class="historial">
    <h2>📋 HISTORIAL DEL DÍA</h2>
    <div id="historial"></div>
    <button class="borrar" onclick="borrarHistorial()">🗑️ BORRAR HISTORIAL</button>
</div>


<!-- MODAL HORA MANUAL -->
<div class="modal" id="modalManual">
    <div class="modal-contenido">
        <h2>⏱️ Inicio manual</h2>
        <p>Selecciona la hora en que empezó la partida.</p>

        <input type="time" id="horaManual">

        <button class="confirmar" onclick="confirmarManual()">
            INICIAR
        </button>

        <button class="cancelar" onclick="cerrarManual()">
            CANCEL
