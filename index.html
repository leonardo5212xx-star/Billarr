<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎱 Control de Billar</title><style>
*{box-sizing:border-box}
body{
    margin:0;
    padding:15px;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    color:#222;
}
h1{text-align:center}
h2{text-align:center;font-size:20px}
.dashboard{
    background:#fff;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    text-align:center;
}
.total{
    font-size:32px;
    font-weight:bold;
}
.mesas{
    display:grid;
    grid-template-columns:1fr;
    gap:15px;
}
.mesa{
    background:white;
    border-radius:15px;
    padding:20px;
    text-align:center;
    box-shadow:0 3px 10px #bbb;
    border-top:7px solid #4caf50;
}
.mesa.ocupada{border-top-color:#f44336}
.estado{
    font-size:20px;
    font-weight:bold;
    margin:10px;
}
.cronometro{
    font-size:30px;
    font-weight:bold;
    margin:15px;
}
button{
    width:100%;
    padding:15px;
    margin-top:8px;
    border:0;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    color:white;
}
.iniciar{background:#4caf50}
.manual{background:#ff9800}
.finalizar{background:#f44336}
.secundario{background:#555}
.historial{
    margin-top:25px;
}
.registro{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:10px;
}
.precio{
    font-size:22px;
    font-weight:bold;
    color:#4caf50;
}
input{
    width:100%;
    padding:12px;
    font-size:20px;
    margin:10px 0;
}
@media(min-width:600px){
    .mesas{grid-template-columns:1fr 1fr}
}
</style></head><body><h1>🎱 CONTROL DE BILLAR</h1>
<h2>4 MESAS</h2><div class="dashboard">
    <div>💰 TOTAL DEL DÍA</div>
    <div class="total" id="total">S/ 0.00</div>
    <div>🔴 Ocupadas: <span id="ocupadas">0</span> / 4</div>
    <div>🟢 Libres: <span id="libres">4</span> / 4</div>
</div><div class="mesas" id="mesas"></div><div class="historial">
<h2>📋 HISTORIAL DEL DÍA</h2>
<div id="historial"></div><button class="secundario" id="borrar">
🗑️ BORRAR HISTORIAL
</button>
</div><script>

const precios=[
    {min:1,max:10,precio:1},
    {min:11,max:15,precio:1.5},
    {min:16,max:23,precio:2},
    {min:24,max:25,precio:3},
    {min:26,max:30,precio:4},
    {min:31,max:35,precio:4.5},
    {min:36,max:40,precio:5},
    {min:41,max:45,precio:5.5},
    {min:46,max:50,precio:6},
    {min:51,max:55,precio:7},
    {min:56,max:59,precio:8}
];

let mesas=JSON.parse(localStorage.getItem("mesas_billar"));

if(!mesas){
    mesas={};
    for(let i=1;i<=4;i++){
        mesas[i]={ocupada:false,inicio:null};
    }
}

let historial=JSON.parse(localStorage.getItem("historial_billar")) || [];

function guardar(){
    localStorage.setItem("mesas_billar",JSON.stringify(mesas));
    localStorage.setItem("historial_billar",JSON.stringify(historial));
}

function calcularPrecio(minutos){

    if(minutos<=0)return 0;

    let horas=Math.floor(minutos/60);
    let resto=minutos%60;

    let total=horas*8;

    if(resto>0){

        for(let p of precios){

            if(resto>=p.min && resto<=p.max){
                total+=p.precio;
                break;
            }

        }

    }

    return total;
}

function hora(timestamp){

    let d=new Date(timestamp);

    return d.toLocaleTimeString("es-PE",{
        hour:"2-digit",
        minute:"2-digit",
        hour12:true
    });
}

function duracion(inicio){

    let minutos=Math.floor((Date.now()-inicio)/60000);

    let h=Math.floor(minutos/60);
    let m=minutos%60;

    return {
        minutos:minutos,
        texto:h>0 ? h+" h "+m+" min" : m+" min"
    };
}

function iniciar(id){

    if(mesas[id].ocupada)return;

    mesas[id].ocupada=true;
    mesas[id].inicio=Date.now();

    guardar();
    mostrar();
}

function inicioManual(id){

    let valor=prompt(
        "Escribe la hora de inicio.\nEjemplo: 08:00"
    );

    if(!valor)return;

    let partes=valor.split(":");

    if(partes.length!==2){
        alert("Hora incorrecta. Usa HH:MM");
        return;
    }

    let h=parseInt(partes[0]);
    let m=parseInt(partes[1]);

    if(isNaN(h)||isNaN(m)||h<0||h>23||m<0||m>59){
        alert("Hora incorrecta.");
        return;
    }

    let ahora=new Date();

    let inicio=new Date(
        ahora.getFullYear(),
        ahora.getMonth(),
        ahora.getDate(),
        h,
        m,
        0
    );

    if(inicio>ahora){
        inicio.setDate(inicio.getDate()-1);
    }

    mesas[id].ocupada=true;
    mesas[id].inicio=inicio.getTime();

    guardar();
    mostrar();
}

function finalizar(id){

    if(!mesas[id].ocupada)return;

    let inicio=mesas[id].inicio;
    let salida=Date.now();

    let d=duracion(inicio);
    let precio=calcularPrecio(d.minutos);

    let confirmar=confirm(
        "MESA "+id+
        "\n\nInicio: "+hora(inicio)+
        "\nSalida: "+hora(salida)+
        "\nTiempo: "+d.texto+
        "\n\nTOTAL: S/ "+precio.toFixed(2)+
        "\n\n¿Confirmar cobro?"
    );

    if(!confirmar)return;

    historial.push({
        mesa:id,
        inicio:hora(inicio),
        salida:hora(salida),
        tiempo:d.texto,
        minutos:d.minutos,
        precio:precio
    });

    mesas[id].ocupada=false;
    mesas[id].inicio=null;

    guardar();
    mostrar();
}

function mostrar(){

    let contenedor=document.getElementById("mesas");
    contenedor.innerHTML="";

    let ocupadas=0;

    for(let i=1;i<=4;i++){

        let mesa=mesas[i];

        if(mesa.ocupada)ocupadas++;

        let div=document.createElement("div");

        div.className="mesa "+(mesa.ocupada?"ocupada":"");

        if(mesa.ocupada){

            let d=duracion(mesa.inicio);
            let precio=calcularPrecio(d.minutos);

            div.innerHTML=`
                <h2>🎱 MESA ${i}</h2>
                <div class="estado">🔴 OCUPADA</div>

                <div>Inicio: <b>${hora(mesa.inicio)}</b></div>

                <div class="cronometro">
                    ${d.texto}
                </div>

                <div>💰 Actual: <b>S/ ${precio.toFixed(2)}</b></div>

                <button class="finalizar"
                onclick="finalizar(${i})">
                ⏹️ FINALIZAR
                </button>
            `;

        }else{

            div.innerHTML=`
                <h2>🎱 MESA ${i}</h2>

                <div class="estado">🟢 LIBRE</div>

                <button class="iniciar"
                onclick="iniciar(${i})">
                ▶️ INICIAR
                </button>

                <button class="manual"
                onclick="inicioManual(${i})">
                ⏱️ INICIO MANUAL
                </button>
            `;
        }

        contenedor.appendChild(div);
    }

    document.getElementById("ocupadas").textContent=ocupadas;
    document.getElementById("libres").textContent=4-ocupadas;

    mostrarHistorial();
}

function mostrarHistorial(){

    let contenedor=document.getElementById("historial");

    contenedor.innerHTML="";

    let total=0;

    historial.forEach(x=>{
        total+=x.precio;
    });

    document.getElementById("total").textContent=
        "S/ "+total.toFixed(2);

    if(historial.length===0){

        contenedor.innerHTML=
        "<p style='text-align:center'>No hay partidas todavía.</p>";

        return;
    }

    [...historial].reverse().forEach(x=>{

        let div=document.createElement("div");

        div.className="registro";

        div.innerHTML=`
            <b>🎱 Mesa ${x.mesa}</b><br>
            ${x.inicio} → ${x.salida}<br>
            Tiempo: ${x.tiempo}<br>
            <div class="precio">
            S/ ${x.precio.toFixed(2)}
            </div>
        `;

        contenedor.appendChild(div);
    });
}

document.getElementById("borrar").addEventListener("click",function(){

    if(historial.length===0){
        alert("No hay historial para borrar.");
        return;
    }

    if(confirm("¿Seguro que quieres borrar todo el historial?")){

        historial=[];

        guardar();
        mostrar();
    }

});

mostrar();

setInterval(function(){

    mostrar();

},1000);

</script></body>
  </html>
